<svg width="100" height="80" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Head shape (white with soft shadow) -->
  <ellipse cx="50" cy="40" rx="30" ry="25" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  
  <!-- Ears -->
  <circle cx="35" cy="20" r="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <circle cx="65" cy="20" r="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <circle cx="35" cy="20" r="6" fill="#F5F5F5"/>
  <circle cx="65" cy="20" r="6" fill="#F5F5F5"/>
  
  <!-- Eyes (dark for contrast) -->
  <circle cx="42" cy="35" r="4" fill="#2E2E2E"/>
  <circle cx="58" cy="35" r="4" fill="#2E2E2E"/>
  
  <!-- Nose (pink accent) -->
  <circle cx="50" cy="45" r="3" fill="#FF6B6B"/>
  
  <!-- Whiskers (subtle gray) -->
  <line x1="50" y1="46" x2="35" y2="43" stroke="#A0A0A0" stroke-width="1.2"/>
  <line x1="50" y1="46" x2="35" y2="48" stroke="#A0A0A0" stroke-width="1.2"/>
  <line x1="50" y1="46" x2="65" y2="43" stroke="#A0A0A0" stroke-width="1.2"/>
  <line x1="50" y1="46" x2="65" y2="48" stroke="#A0A0A0" stroke-width="1.2"/>
</svg>